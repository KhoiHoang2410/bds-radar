openapi: 3.0.3
info:
  title: BDS Radar API
  version: "1.0.0"
  description: >
    JSON-only API over normalized Vietnamese real-estate listings.
    Every request body must be application/json; every response is JSON.
servers:
  - url: http://localhost:3000

paths:
  /provinces:
    get:
      summary: List provinces (crawl-control surface)
      operationId: listProvinces
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: All provinces, ordered by name (paginated, 25/page).
          content:
            application/json:
              schema:
                type: object
                properties:
                  provinces:
                    type: array
                    items:
                      $ref: "#/components/schemas/Province"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
  /provinces/{id}:
    patch:
      summary: Toggle schedule_fetch / adjust fetch_page_depth
      operationId: updateProvince
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                schedule_fetch:
                  type: boolean
                fetch_page_depth:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Updated province.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Province"
        "404":
          description: No such province.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "415":
          description: Request body was not application/json.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"

  /real_estate_sources:
    get:
      summary: List stored sources (tracer-bullet read-back)
      operationId: listRealEstateSources
      description: >
        Filter via ransack q[...] predicates, e.g. q[supplier_eq]=mogi,
        q[status_eq]=active, q[price_gteq]=1000000000. Paginated (25/page).
      parameters:
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Stored sources, newest-seen first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  real_estate_sources:
                    type: array
                    items:
                      $ref: "#/components/schemas/RealEstateSource"
                  pagination:
                    $ref: "#/components/schemas/Pagination"

  /real_estates:
    get:
      summary: Query normalized properties (analytics API)
      operationId: listRealEstates
      description: >
        Filter via ransack q[...] predicates. Common ones:
        q[province_id_eq] (canonical province), q[ward_city_id_eq],
        q[district_or_city_cont], q[type_eq], q[price_gteq]/q[price_lteq],
        q[area_gteq]/q[area_lteq], and a bbox via
        q[latitude_gteq]/q[latitude_lteq] + q[longitude_gteq]/q[longitude_lteq].
        Defaults to status=active unless q[status_eq] is given. Paginated (25/page).
      parameters:
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Matching properties, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  real_estates:
                    type: array
                    items:
                      $ref: "#/components/schemas/RealEstate"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
  /real_estates/{id}:
    get:
      summary: Show one property (incl. derived map_url)
      operationId: showRealEstate
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The property.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealEstate"
        "404":
          description: Not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"

components:
  parameters:
    Q:
      name: q
      in: query
      style: deepObject
      explode: true
      description: ransack predicate map, e.g. q[type_eq]=condo&q[price_lteq]=5000000000
      schema:
        type: object
        additionalProperties: true
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      description: items per page (clamped to 100)
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
  schemas:
    Pagination:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total_count: { type: integer }
        total_pages: { type: integer }
    RealEstate:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, enum: [condo, house, land, commercial, other] }
        price: { type: integer, description: VND }
        area: { type: number, description: square meters }
        province_id: { type: integer, description: canonical }
        province: { type: string, description: raw display string }
        district_or_city: { type: string }
        ward: { type: string }
        ward_city_id: { type: integer, nullable: true }
        latitude: { type: number }
        longitude: { type: number }
        image_urls: { type: array, items: { type: string } }
        source_urls: { type: array, items: { type: string } }
        status: { type: string, enum: [active, inactive] }
        map_url: { type: string, description: derived from coords, never stored }
    Province:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        alternatives:
          type: array
          items:
            type: string
        schedule_fetch:
          type: boolean
        fetch_page_depth:
          type: integer
    RealEstateSource:
      type: object
      properties:
        id: { type: integer }
        supplier: { type: string }
        external_id: { type: string }
        status: { type: string, enum: [active, inactive] }
        source_url: { type: string }
        type: { type: string, enum: [condo, house, land, commercial, other] }
        price: { type: integer, description: VND }
        area: { type: number, description: square meters }
        address: { type: string }
        province: { type: string, description: raw parsed string (drifts) }
        district_or_city: { type: string }
        ward: { type: string }
        street: { type: string, nullable: true }
        image_urls:
          type: array
          items: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        last_seen_at: { type: string, format: date-time }
    Errors:
      type: object
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
