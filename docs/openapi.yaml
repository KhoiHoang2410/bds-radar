openapi: 3.0.3
info:
  title: BDS Radar API
  version: "1.0.0"
  description: >
    JSON-only API over normalized Vietnamese real-estate listings.
    Every request body must be application/json; every response is JSON.
servers:
  - url: http://localhost:3000

paths:
  /provinces:
    get:
      summary: List provinces (crawl-control surface)
      operationId: listProvinces
      responses:
        "200":
          description: All provinces, ordered by name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  provinces:
                    type: array
                    items:
                      $ref: "#/components/schemas/Province"
  /provinces/{id}:
    patch:
      summary: Toggle schedule_fetch / adjust fetch_page_depth
      operationId: updateProvince
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                schedule_fetch:
                  type: boolean
                fetch_page_depth:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Updated province.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Province"
        "404":
          description: No such province.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "415":
          description: Request body was not application/json.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"
        "422":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"

  /real_estate_sources:
    get:
      summary: List stored sources (tracer-bullet read-back)
      operationId: listRealEstateSources
      parameters:
        - name: supplier
          in: query
          schema:
            type: string
        - name: province_id
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
      responses:
        "200":
          description: Stored sources, newest-seen first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  real_estate_sources:
                    type: array
                    items:
                      $ref: "#/components/schemas/RealEstateSource"
        "422":
          description: Invalid filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Errors"

components:
  schemas:
    Province:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        alternatives:
          type: array
          items:
            type: string
        schedule_fetch:
          type: boolean
        fetch_page_depth:
          type: integer
    RealEstateSource:
      type: object
      properties:
        id: { type: integer }
        supplier: { type: string }
        external_id: { type: string }
        status: { type: string, enum: [active, inactive] }
        source_url: { type: string }
        type: { type: string, enum: [condo, house, land, commercial, other] }
        price: { type: integer, description: VND }
        area: { type: number, description: square meters }
        address: { type: string }
        province: { type: string, description: raw parsed string (drifts) }
        district_or_city: { type: string }
        ward: { type: string }
        street: { type: string, nullable: true }
        image_urls:
          type: array
          items: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        last_seen_at: { type: string, format: date-time }
    Errors:
      type: object
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
