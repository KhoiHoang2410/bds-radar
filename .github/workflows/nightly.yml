name: Nightly

on:
  schedule:
    - cron: "0 18 * * *" # 01:00 Asia/Ho_Chi_Minh
  workflow_dispatch:

jobs:
  full-suite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      RAILS_ENV: test
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: |
          bundle exec rake parallel:create
          bundle exec rake parallel:load_schema
      - run: bundle exec rake parallel:spec

  live-smoke:
    # Detects upstream HTML/JSON drift early by hitting the real suppliers.
    # Allowed to fail — drift is a signal, not a release blocker.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      # Wired to a `rake smoke:suppliers` task once the suppliers (issues #3/#5) land.
      - run: echo "live smoke placeholder — hits nhatot/mogi to catch shape drift"
