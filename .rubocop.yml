# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

AllCops:
  TargetRubyVersion: 3.2
  NewCops: disable
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "db/migrate/**/*"
    - "config/**/*"
    - "vendor/**/*"
    - "tmp/**/*"
    - "node_modules/**/*"

# Specs read more naturally with long describe/example blocks.
Metrics/BlockLength:
  Enabled: false

Style/Documentation:
  Enabled: false
